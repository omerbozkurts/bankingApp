[project]
name = "abbank-backend"
version = "0.1.0"
description = "AB Bank API (FastAPI + PostgreSQL)"
authors = [
    { name = "omerbozkurts", email = "omerbozkurt912@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi[standard]==0.162.0",
    "pwdlib[argon2]==0.3.1",
    "pydantic==2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt==2.15.1",
    "sqlalchemy[asyncio]==2.1.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
